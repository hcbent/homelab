---
# Add Kibana to a cluster that is built and running (docs/DESIGN_KIBANA.md). Terraform has already made the machine.
# Inventory: generated by app/configmgmt/inventory.py (kind "add_kibana"); the Kibana machines are the group kibana_hosts, and every Elasticsearch node is
# in es_nodes (one of them signs Kibana's certificate). Extra vars (secrets, never in the inventory): es_api_key, the cluster CA as es_ca_cert_pem and
# es_ca_key_pem, the three encryption keys as kibana_encryption_keys, and kibana_service_token when ECM already holds one.
#
# Only the Kibana machine is touched. No Elasticsearch node is configured or restarted.
- name: Get Kibana a service token
  ansible.builtin.import_playbook: kibana_credential.yml

# first_boot_hosts is set by the runner to kibana_hosts, so only the new machine is waited for.
- ansible.builtin.import_playbook: wait_for_first_boot.yml

- name: Install and configure Kibana
  hosts: kibana_hosts
  become: true
  gather_facts: true
  vars:
    es_package_name: kibana
    es_tls_dir: /etc/kibana/certs
    es_tls_group: kibana
  pre_tasks:
    - name: Refuse to run with a different kind of inventory
      ansible.builtin.assert:
        that: es_operation == 'add_kibana'
        fail_msg: This playbook adds Kibana to a running cluster; the inventory says {{ es_operation }}.
      run_once: true
    # The worker's play made the token (or was handed it); it is a fact of localhost, so carry it to this machine.
    - name: Take the service token from the worker's play
      ansible.builtin.set_fact:
        kibana_token_value: "{{ hostvars['localhost'].kibana_token_value }}"
      no_log: true
      when: hostvars['localhost'].kibana_token_value is defined
  roles:
    - os_base
    - es_package
    - es_tls
    - kibana

- name: Check Kibana is available
  ansible.builtin.import_playbook: kibana_health.yml
