---
# The worker-side half of adding Kibana: get a service-account token for it from the cluster (or use the one ECM already holds). Run first, so a token that
# was made is handed back to ECM even if a later play fails. Inventory: kind "add_kibana". Extra vars (secrets, never in the inventory): es_api_key, and
# kibana_service_token when ECM already holds one; plus es_ca_file.
- name: Get a service token for Kibana
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - kibana_credential
