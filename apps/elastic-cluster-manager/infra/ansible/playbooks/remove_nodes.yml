---
# Remove nodes from a cluster that is built and running (docs/DESIGN_REMOVE_NODE.md). Run by the worker, twice: before Terraform
# destroys the machines (es_dr_phase: drain) and after it has (es_dr_phase: after). Nothing here connects to a node over SSH.
# Inventory: generated by app/configmgmt/inventory.py (kinds "remove_drain" and "remove_check"). The nodes that REMAIN are
# the inventory; the nodes going are the list es_removing. Extra vars (secrets, never in the inventory): es_api_key; plus
# es_ca_file and es_dr_phase.
#
# drain: asks Elasticsearch to move every shard off the nodes (the node shutdown API, type remove) and waits for it to say it
#        has. If it cannot, it cancels the shutdown and stops, with nothing destroyed.
# after: waits for the cluster to be green without the nodes, then clears their shutdown records.
- name: Drain the nodes that are being removed, or check the cluster once they are gone
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - es_drain
