---
# Build a new cluster on VMs that Terraform has just created. Run once per cluster, before bootstrapped_at is set.
# Inventory: generated by app/configmgmt/inventory.py (operation kind "create").
# Extra vars (never in the inventory): es_elastic_password; es_ca_cert_pem and es_ca_key_pem only to reuse a CA.
- name: Prepare every node (OS, data disk, package)
  hosts: es_nodes
  become: true
  gather_facts: true
  pre_tasks:
    - name: Refuse to run a create with a converge inventory
      ansible.builtin.assert:
        that: es_operation == 'create'
        fail_msg: This playbook builds a new cluster; the inventory says {{ es_operation }}.
      run_once: true
  roles:
    - os_base
    - data_disk
    - es_package

- name: Issue and distribute node certificates
  hosts: es_nodes
  become: true
  gather_facts: false
  roles:
    - es_tls

- name: Configure and start every node
  hosts: es_nodes
  become: true
  gather_facts: false
  roles:
    - es_node

- name: Verify the cluster formed and hand credentials back to ECM
  hosts: es_bootstrap
  become: true
  gather_facts: false
  roles:
    - es_bootstrap
