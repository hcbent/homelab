---
# Build a new cluster on VMs that Terraform has just created. Run once per cluster, before bootstrapped_at is set.
# Inventory: generated by app/configmgmt/inventory.py (operation kind "create").
# Extra vars (never in the inventory): es_elastic_password; es_ca_cert_pem and es_ca_key_pem only to reuse a CA.
# Terraform returns as soon as the machines exist, so on a real create they may still be booting, and cloud-init
# may still be running (and holding the apt lock). Wait for both before touching anything.
- name: Wait for the machines to accept SSH and finish their first boot
  hosts: es_nodes
  gather_facts: false
  tasks:
    - name: Wait until SSH answers
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 600

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false  # a degraded cloud-init is not ours to fail on; the roles check what they need
      timeout: 900

- name: Prepare every node (OS, data disk, package)
  hosts: es_nodes
  become: true
  gather_facts: true
  pre_tasks:
    - name: Refuse to run a create with a converge inventory
      ansible.builtin.assert:
        that: es_operation == 'create'
        fail_msg: This playbook builds a new cluster; the inventory says {{ es_operation }}.
      run_once: true
  roles:
    - os_base
    - data_disk
    - es_package

- name: Issue and distribute node certificates
  hosts: es_nodes
  become: true
  gather_facts: false
  roles:
    - es_tls

- name: Configure and start every node
  hosts: es_nodes
  become: true
  gather_facts: false
  roles:
    - es_node

- name: Verify the cluster formed and hand credentials back to ECM
  hosts: es_bootstrap
  become: true
  gather_facts: false
  roles:
    - es_bootstrap
