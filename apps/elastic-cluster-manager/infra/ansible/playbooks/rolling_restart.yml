---
# Restart the nodes of a built cluster one at a time so each takes on the size Terraform has set for its VM
# (docs/DESIGN_RESIZE.md). Run by the worker, which asks Elasticsearch about the cluster and asks Proxmox to restart each
# VM; nothing here connects to a node over SSH. Inventory: generated by app/configmgmt/inventory.py (kind "restart").
# Extra vars (secrets, never in the inventory): es_api_key, pve_token_secret; plus es_ca_file, pve_api_url, pve_token_id
# and pve_verify_tls (and pve_ca_file when the connection has its own CA).
#
# For each node that is not yet at its target size, in the order coordinating-only nodes, data nodes, master-eligible
# nodes (the elected master last): wait for green with every node present, restrict shard allocation to primaries, flush,
# restart the VM through Proxmox, wait for the node to come back at its new size, restore allocation, wait for green.
# It stops at the first node that fails. A node already at its target size is skipped, so running it again resumes.
- name: Restart the nodes that are not at their target size, one at a time
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - es_rolling_restart
