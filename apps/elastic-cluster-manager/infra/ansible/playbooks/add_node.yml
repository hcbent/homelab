---
# Add nodes to a cluster that is built and running (docs/DESIGN_ADD_NODE.md). Terraform has already made the VMs.
# Inventory: generated by app/configmgmt/inventory.py (kind "add_node"); the new nodes are the group es_new_nodes.
# Extra vars (secrets, never in the inventory): es_api_key, and the cluster CA as es_ca_cert_pem and es_ca_key_pem.
#
# Only the new nodes are touched. The existing nodes are neither configured nor restarted (their seed lists catch up at
# the next converge), and a certificate is issued only to a node that has none, so the existing ones keep theirs.
- name: Make sure the cluster is healthy before anything is started
  ansible.builtin.import_playbook: join_check.yml
  vars:
    es_join_phase: before

# first_boot_hosts is set by the runner to es_new_nodes, so only the new machines are waited for.
- ansible.builtin.import_playbook: wait_for_first_boot.yml

- name: Prepare the new nodes (OS, data disk, package)
  hosts: es_new_nodes
  become: true
  gather_facts: true
  pre_tasks:
    - name: Refuse to run with a different kind of inventory
      ansible.builtin.assert:
        that: es_operation == 'add_node'
        fail_msg: This playbook adds nodes to a running cluster; the inventory says {{ es_operation }}.
      run_once: true
  roles:
    - os_base
    - data_disk
    - es_package

- name: Issue the new nodes' certificates
  hosts: es_new_nodes
  become: true
  gather_facts: false
  roles:
    - es_tls

- name: Configure and start the new nodes
  hosts: es_new_nodes
  become: true
  gather_facts: false
  roles:
    - es_node

- name: Check the new nodes joined and the cluster is green
  ansible.builtin.import_playbook: join_check.yml
  vars:
    es_join_phase: after
