[defaults]
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
result_format = yaml
# Connection settings (user, key, known-hosts file) come from the generated inventory, never from here.

[ssh_connection]
pipelining = True
# Try a refused or dropped connection again (with a growing pause, about a minute in all) before calling the host
# unreachable. A task may then run twice if the connection drops after it started, which is safe because every task
# here is idempotent. The first-boot wait covers the longer drops.
retries = 5
