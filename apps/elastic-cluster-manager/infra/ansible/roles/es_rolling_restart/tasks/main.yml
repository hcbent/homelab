---
- name: Check the inputs this role needs
  ansible.builtin.assert:
    that:
      - es_api_key is defined and es_api_key | length > 0
      - es_ca_file is defined
      - pve_api_url is defined and pve_token_id is defined and pve_token_secret is defined
      - es_expected_nodes is defined
      - groups['es_nodes'] | length > 1
    fail_msg: >-
      A rolling restart needs the ECM API key, the cluster CA, the Proxmox address and token, the expected node
      count and a cluster of more than one node.

- name: Describe each node
  ansible.builtin.set_fact:
    es_rr_nodes: >-
      {{ groups['es_nodes'] | map('extract', hostvars) | list }}
    es_rr_headers:
      Authorization: "ApiKey {{ es_api_key }}"
  no_log: true

# Which nodes to restart, and in what order, is decided by ECM when the restart is planned (es_restart_plan, docs/DESIGN_RECOVERY.md,
# slice 5b), or, after a resize, by which nodes are not yet at their target size.
- name: Restart the nodes ECM planned, in its order
  ansible.builtin.include_tasks: planned.yml
  when: es_restart_plan is defined

- name: Restart the nodes that are not at their target size
  ansible.builtin.include_tasks: sized.yml
  when: es_restart_plan is not defined

