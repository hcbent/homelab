---
# Restart or start one node. es_rr_in_cluster says whether the cluster has it now.
- name: Find the host {{ es_rr_name }}'s VM is on
  ansible.builtin.include_tasks: locate_vm.yml

- name: Read the state of {{ es_rr_name }}'s VM in Proxmox
  ansible.builtin.uri:
    url: "{{ pve_api_url }}/api2/json/nodes/{{ es_rr_pve_node }}/qemu/{{ es_rr_node.es_vmid }}/status/current"
    headers:
      Authorization: "PVEAPIToken={{ pve_token_id }}={{ pve_token_secret }}"
    validate_certs: "{{ pve_verify_tls | bool }}"
    ca_path: "{{ pve_ca_file | default(omit) }}"
    return_content: true
  register: es_rr_vm

- name: Note whether the VM is stopped
  ansible.builtin.set_fact:
    es_rr_vm_stopped: "{{ es_rr_vm.json.data.status | default('') == 'stopped' }}"

- name: "{{ 'Restart' if es_rr_in_cluster | bool else ('Start' if es_rr_vm_stopped | bool else 'Restart') }} {{ es_rr_name }}"
  block:
    - name: Wait for green with every node present, before restarting {{ es_rr_name }}
      ansible.builtin.include_tasks: gate.yml
      vars:
        es_rr_status: green
        es_rr_what: "before restarting {{ es_rr_name }}"
      when: es_rr_in_cluster | bool

    # A node that is not in the cluster is what is wrong with it, so all that can be asked first is that the cluster answers.
    - name: Check that the cluster answers, before bringing {{ es_rr_name }} back
      ansible.builtin.include_tasks: gate.yml
      vars:
        es_rr_status: red
        es_rr_any_count: true
        es_rr_what: "before bringing {{ es_rr_name }} back"
      when: not (es_rr_in_cluster | bool)

    - name: Restrict shard allocation to primaries, so no replica is rebuilt elsewhere while the node is down
      ansible.builtin.uri:
        url: "{{ es_rr_scheme }}://{{ es_rr_ask }}:{{ es_rr_http_port }}/_cluster/settings"
        method: PUT
        headers: "{{ es_rr_headers }}"
        ca_path: "{{ es_ca_file }}"
        body_format: json
        body:
          persistent:
            cluster.routing.allocation.enable: primaries
      when: es_rr_in_cluster | bool

    - name: Remember that allocation is restricted
      ansible.builtin.set_fact:
        es_rr_allocation_changed: true
      when: es_rr_in_cluster | bool

    - name: Flush, so the node recovers quickly (not essential)
      ansible.builtin.uri:
        url: "{{ es_rr_scheme }}://{{ es_rr_ask }}:{{ es_rr_http_port }}/_flush"
        method: POST
        headers: "{{ es_rr_headers }}"
        ca_path: "{{ es_ca_file }}"
      failed_when: false
      when: es_rr_in_cluster | bool

    - name: Ask Proxmox to {{ 'start' if es_rr_vm_stopped | bool else 'restart' }} {{ es_rr_name }}'s VM
      ansible.builtin.uri:
        url: >-
          {{ pve_api_url }}/api2/json/nodes/{{ es_rr_pve_node }}/qemu/{{ es_rr_node.es_vmid }}/status/{{ 'start' if es_rr_vm_stopped | bool else 'reboot' }}
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ pve_token_id }}={{ pve_token_secret }}"
        validate_certs: "{{ pve_verify_tls | bool }}"
        ca_path: "{{ pve_ca_file | default(omit) }}"
        return_content: true
      register: es_rr_reboot

    - name: Wait for Proxmox to finish
      ansible.builtin.uri:
        url: >-
          {{ pve_api_url }}/api2/json/nodes/{{ es_rr_pve_node }}/tasks/{{ es_rr_reboot.json.data | urlencode }}/status
        headers:
          Authorization: "PVEAPIToken={{ pve_token_id }}={{ pve_token_secret }}"
        validate_certs: "{{ pve_verify_tls | bool }}"
        ca_path: "{{ pve_ca_file | default(omit) }}"
        return_content: true
      register: es_rr_task
      until: es_rr_task.json.data.status | default('') == 'stopped'
      retries: "{{ (es_rr_pve_wait | int / es_rr_poll | int) | round(0, 'ceil') | int }}"
      delay: "{{ es_rr_poll }}"

    - name: Stop if Proxmox reports it failed
      ansible.builtin.fail:
        msg: "Proxmox reports that {{ 'starting' if es_rr_vm_stopped | bool else 'restarting' }} {{ es_rr_name }} ended with: {{ es_rr_task.json.data.exitstatus | default('no status') }}"
      when: es_rr_task.json.data.exitstatus | default('') != 'OK'

    - name: Wait for {{ es_rr_name }} to join the cluster
      ansible.builtin.uri:
        url: "{{ es_rr_scheme }}://{{ es_rr_ask }}:{{ es_rr_http_port }}/_nodes?filter_path=nodes.*.name"
        headers: "{{ es_rr_headers }}"
        ca_path: "{{ es_ca_file }}"
        return_content: true
        status_code: [200, 503]
      register: es_rr_back
      until: >-
        es_rr_back.status == 200 and
        (es_rr_back.json.nodes.values() | selectattr('name', 'equalto', es_rr_name) | list | length) == 1
      retries: "{{ (es_rr_rejoin_wait | int / es_rr_poll | int) | round(0, 'ceil') | int }}"
      delay: "{{ es_rr_poll }}"

    - name: Wait for every primary to be active again (yellow or better)
      ansible.builtin.include_tasks: gate.yml
      vars:
        es_rr_status: yellow
        es_rr_any_count: "{{ not (es_rr_in_cluster | bool) }}"
        es_rr_what: "after {{ es_rr_name }} rejoined"

    - name: Allow shard allocation again
      ansible.builtin.uri:
        url: "{{ es_rr_scheme }}://{{ es_rr_ask }}:{{ es_rr_http_port }}/_cluster/settings"
        method: PUT
        headers: "{{ es_rr_headers }}"
        ca_path: "{{ es_ca_file }}"
        body_format: json
        body:
          persistent:
            cluster.routing.allocation.enable: null
      when: es_rr_in_cluster | bool

    - name: Remember that allocation is allowed again
      ansible.builtin.set_fact:
        es_rr_allocation_changed: false

    - name: Wait for green before the next node, when this one was in the cluster
      ansible.builtin.include_tasks: gate.yml
      vars:
        es_rr_status: green
        es_rr_what: "after {{ es_rr_name }} was restarted"
      when: es_rr_in_cluster | bool

  rescue:
    - name: Look for every node, to know whether it is safe to allow allocation again
      ansible.builtin.uri:
        url: "{{ es_rr_scheme }}://{{ es_rr_ask | default(es_rr_ask_pool[0].ansible_host) }}:{{ es_rr_http_port }}/_cluster/health"
        headers: "{{ es_rr_headers }}"
        ca_path: "{{ es_ca_file }}"
        return_content: true
      register: es_rr_after
      failed_when: false
      when: es_rr_allocation_changed | bool

    - name: Allow shard allocation again if every node is present
      ansible.builtin.uri:
        url: "{{ es_rr_scheme }}://{{ es_rr_ask }}:{{ es_rr_http_port }}/_cluster/settings"
        method: PUT
        headers: "{{ es_rr_headers }}"
        ca_path: "{{ es_ca_file }}"
        body_format: json
        body:
          persistent:
            cluster.routing.allocation.enable: null
      register: es_rr_restored
      failed_when: false
      when:
        - es_rr_allocation_changed | bool
        - es_rr_after.json.number_of_nodes | default(0) | int == es_expected_nodes | int

    - name: Stop, and say what state the cluster is in
      ansible.builtin.fail:
        msg: >-
          The restart stopped at {{ es_rr_name }}: {{ ansible_failed_result.msg | default('a step failed') }}.
          {% if es_rr_allocation_changed | bool and es_rr_restored is defined and es_rr_restored.skipped | default(false) %}
          Shard allocation is still restricted to primaries, because not every node is present; once the node is back,
          allow it again with PUT _cluster/settings {"persistent": {"cluster.routing.allocation.enable": null}}.
          {% elif es_rr_allocation_changed | bool %}
          Shard allocation was allowed again.
          {% endif %}
          Nodes restarted before this one stay restarted. Retry skips every node this operation has already restarted.
