---
# Only a Kibana ECM is setting up reaches this role, so it is restarted when its configuration or keystore changed.
- name: Restart kibana
  ansible.builtin.systemd:
    name: kibana
    state: restarted
    daemon_reload: true
  # Restarting Kibana restarts it itself, once, after rewriting the configuration; the handler would restart it a second time at the end of the play.
  when: not (kibana_restart_explicitly | default(false) | bool)
  listen: Kibana configuration changed
