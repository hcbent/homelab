# Run from deploy/: docker compose --env-file .env up -d --build
x-app-env: &app-env
  ECM_DATABASE_URL: postgresql+psycopg://ecm:${POSTGRES_PASSWORD}@postgres:5432/ecm
  ECM_MASTER_KEY: ${ECM_MASTER_KEY}
  ECM_ADMIN_USERNAME: ${ECM_ADMIN_USERNAME:-admin}
  ECM_ADMIN_PASSWORD_HASH: ${ECM_ADMIN_PASSWORD_HASH}
  ECM_SECURE_COOKIES: ${ECM_SECURE_COOKIES:-true}
  ECM_DEFAULT_TEMPLATE_VMID: ${ECM_DEFAULT_TEMPLATE_VMID:-}
  ECM_DEFAULT_TEMPLATE_NAME: ${ECM_DEFAULT_TEMPLATE_NAME:-}
  ECM_DEFAULT_STORAGE: ${ECM_DEFAULT_STORAGE:-tank}
  ECM_SYNC_INTERVAL_MINUTES: ${ECM_SYNC_INTERVAL_MINUTES:-5}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ecm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecm"]
      interval: 5s
      retries: 10

  migrate:
    build: {context: ../backend, target: app}
    command: python -m app.migrate
    environment: *app-env
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"

  api:
    build: {context: ../backend, target: app}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: *app-env
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped
    # Bound to the compose network only; Caddy reaches it through `web`.

  worker:
    # The only image with Terraform, the vendored provider, Ansible and an SSH client (see backend/Dockerfile).
    build:
      context: ../backend
      target: worker
      # The playbooks and roles, copied into the image at /opt/ecm/ansible (COPY --from=ecm_ansible).
      additional_contexts:
        ecm_ansible: ../infra/ansible
    command: procrastinate --app=app.jobs.queue worker
    environment:
      <<: *app-env
      # Where Terraform keeps state (one schema per cluster). Empty means ECM's own database, which the app
      # builds from ECM_DATABASE_URL with every part percent-encoded (a password with # or @ is fine). Set
      # ECM_TF_STATE_URL in .env to use a separate database. Handed to Terraform as PG_CONN_STR and nowhere else.
      ECM_TF_STATE_URL: ${ECM_TF_STATE_URL:-}
      ECM_TF_STATE_SSLMODE: ${ECM_TF_STATE_SSLMODE:-disable}
      # How the worker reaches the VMs it configures (Ansible). The key is mounted below, never copied into the image.
      ECM_SSH_USER: ${ECM_SSH_USER:-bret}
      ECM_SSH_KEY_PATH: /run/ecm/ssh/github_rsa
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped
    volumes:
      - appdata:/data   # state snapshots (later phases)
      # Terraform workspaces. A separate volume, because appdata already exists on deployed hosts owned by
      # root, while a new volume takes the ownership the image gives /data/clusters (the ecm user).
      - clusters:/data/clusters
      # One key file, read-only, never the whole ~/.ssh. create_host_path: false makes a wrong path an error instead
      # of Docker silently creating a directory there. Point it at a copy owned by uid 10001 with mode 0600 (see
      # "SSH key delivery" in docs/DECISIONS.md). Do not grant the worker access to your own key with an ACL:
      # that changes the file's group bits, and ssh then refuses the key when its owner uses it.
      - type: bind
        source: ${ECM_SSH_KEY_FILE:?set ECM_SSH_KEY_FILE in deploy/.env to the host path of the SSH private key}
        target: /run/ecm/ssh/github_rsa
        read_only: true
        bind: {create_host_path: false}

  web:
    build: {context: ../frontend}
    depends_on: [api]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8480:8080"   # Caddy on this host proxies ecm.lab.thewortmans.org here

volumes:
  pgdata:
  appdata:
  clusters:
