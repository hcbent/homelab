# =====================================================================
# RHEL 10 Kickstart  —  Proxmox golden template
# Headless server, DHCP, LVM auto, key-only admin login, no RHSM.
# Install ONCE from this file, convert the VM to a template, clone x4.
#
# NOTE: kickstart only allows comments when '#' starts the line.
# Never put a trailing '#' comment after a command.
# =====================================================================

# --- Install mode ---------------------------------------------------
# text        = no graphical installer
# reboot      = reboot when done; --eject ejects the CD
text
reboot --eject

# --- Installation source (ISO only — no subscription) ---------------
# The RHEL 10 DVD ISO carries both BaseOS and AppStream. 'cdrom'
# installs from the attached DVD; no network repo, no registration.
cdrom

# --- Localization ---------------------------------------------------
# Change the timezone below if needed.
keyboard --xlayouts='us'
lang en_US.UTF-8
timezone America/New_York --utc

# --- Networking (DHCP) ----------------------------------------------
# Shared template hostname; rename per-VM after cloning (see notes).
network --bootproto=dhcp --device=link --activate --onboot=on
network --hostname=rhel10-template

# --- Security -------------------------------------------------------
firewall --enabled --ssh
selinux --enforcing
firstboot --disable

# --- Accounts -------------------------------------------------------
# Root login is LOCKED. All access is via the sudo user + SSH key.
rootpw --lock

# Admin user with passwordless-capable sudo (via wheel).
# Regenerate the hash with:  openssl passwd -6
user --name=bret --groups=wheel --iscrypted --password='$6$NM04Op.n4baZngsc$e9mI5Tbz/i8znDXRNvhjqmnGrYDIwjDDPyl6Tokjk2l3BIDFCh66sz3G1wMee5FrTwpw6MQnuD.Tvcuy.1Q.t/'

# SSH public key for the admin user (key-only login).
sshkey --username=bret "ssh-rsa  bret.wortman@damascusgrp.com"

# --- Disk / partitioning (LVM auto on the 256 GB disk) --------------
# No --drives= so it works whether the disk is /dev/sda (SCSI) or
# /dev/vda (VirtIO block). autopart creates /boot (+ /boot/efi on
# UEFI), a root LV, and a swap LV sized to RAM.
zerombr
clearpart --all --initlabel
autopart --type=lvm --nohome

# --- Bootloader -----------------------------------------------------
bootloader --location=mbr --timeout=5

# --- Packages -------------------------------------------------------
# qemu-guest-agent is required for Proxmox guest integration.
%packages
@^server-product-environment
qemu-guest-agent
vim-enhanced
git
tmux
chrony
bash-completion
%end

# --- Post-install ---------------------------------------------------
%post --log=/root/ks-post.log

# Ensure the Proxmox guest agent is running.
systemctl enable --now qemu-guest-agent 2>/dev/null || true

# Harden SSH: key-only, no root login, no password auth.
install -d -m 0755 /etc/ssh/sshd_config.d
cat > /etc/ssh/sshd_config.d/00-hardening.conf <<'EOF'
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
EOF

# Passwordless sudo for wheel (comment out to require a password).
echo '%wheel ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/wheel-nopasswd
chmod 0440 /etc/sudoers.d/wheel-nopasswd

%end
