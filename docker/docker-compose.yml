version: '3.8'

services:
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./jackett/config:/config
      - ./jackett/downloads:/downloads
    ports:
      - "9117:9117"
    restart: unless-stopped
    networks:
      - media-net

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8080
    volumes:
      - ./qbittorrent/config:/config
      - media-storage:/data
      - downloads-storage:/downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    networks:
      - media-net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      # UMASK 000 so Plex (separate VM) can write to the shared media library
      - UMASK=000
    volumes:
      - ./sonarr/config:/config
      - media-storage:/data
      - downloads-storage:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped
    depends_on:
      - qbittorrent
      - jackett
    networks:
      - media-net

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      # UMASK 000 so Plex (separate VM) can write to the shared media library
      - UMASK=000
    volumes:
      - ./radarr/config:/config
      - media-storage:/data
      - downloads-storage:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped
    depends_on:
      - qbittorrent
      - jackett
    networks:
      - media-net

  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - UMASK=000
      # Sonarr Configuration (API key sourced from .env / Ansible vault)
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${UN_SONARR_0_API_KEY}
      # Radarr Configuration (API key sourced from .env / Ansible vault)
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${UN_RADARR_0_API_KEY}
      # General Configuration
      - UN_DEBUG=false
      - UN_LOG_FILE=/config/unpackerr.log
      - UN_LOG_FILES=10
      - UN_LOG_FILE_MB=10
      - UN_INTERVAL=2m
      - UN_START_DELAY=1m
      - UN_RETRY_DELAY=5m
      - UN_MAX_RETRIES=3
      - UN_PARALLEL=1
      - UN_FILE_MODE=0644
      - UN_DIR_MODE=0755
    volumes:
      - ./unpackerr/config:/config
      - media-storage:/data
    restart: unless-stopped
    depends_on:
      - sonarr
      - radarr
      - qbittorrent
    networks:
      - media-net

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./tautulli/config:/config
    ports:
      - "8181:8181"
    restart: unless-stopped
    networks:
      - media-net

  maintainerr:
    # Custom patched build saved/loaded from the old cluster (ttl.sh tag is
    # ephemeral); falls back to upstream if MAINTAINERR_IMAGE is unset.
    image: ${MAINTAINERR_IMAGE:-ghcr.io/jorenn92/maintainerr:latest}
    container_name: maintainerr
    environment:
      - TZ=America/New_York
    volumes:
      - ./maintainerr/data:/opt/data
    ports:
      - "6246:6246"
    restart: unless-stopped
    networks:
      - media-net

volumes:
  media-storage:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.1.230,rw,nfsvers=4
      device: ":/volume1/video"
  downloads-storage:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.1.230,rw,nfsvers=4
      device: ":/volume1/video/downloads"
networks:
  media-net:
    driver: bridge
