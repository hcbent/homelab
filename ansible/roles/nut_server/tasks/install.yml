---
# NUT server installation tasks

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install NUT package
  ansible.builtin.apt:
    name: nut
    state: present

- name: Ensure NUT services are enabled (Debian/Ubuntu style)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - nut-server
    - nut-monitor
  ignore_errors: true
